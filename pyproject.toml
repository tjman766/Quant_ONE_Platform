[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-one-platform"
version = "0.0.1"
description = "Quant ONE Platform"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP"
]
ignore = []

[tool.coverage.run]
source = [
    "app"
]

[tool.coverage.report]
show_missing = true
skip_empty = true